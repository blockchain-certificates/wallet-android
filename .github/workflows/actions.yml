name: CI

on: [push, pull_request]

env:
  TARGET_VERSION: 35
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master'
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK components
        run: |
          sdkmanager "build-tools;$ANDROID_BUILD_TOOLS_VERSION"
          sdkmanager "platforms;android-$TARGET_VERSION"
          sdkmanager --licenses || true
      
      - name: Make gradlew executable
        working-directory: ./LearningMachine
        run: chmod +x gradlew
      
      - name: Run tests
        working-directory: ./LearningMachine
        run: ./gradlew clean testDevDebug -PdisablePreDex -PdevBuild --console=plain